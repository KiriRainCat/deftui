[changelog]
trim = true
body = """
{% set repository = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo -%}
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## 未发布
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | trim }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repository }}/commit/{{ commit.id }}))\
{% endfor %}
{% endfor -%}
{% if version and previous.version %}
[完整变更]({{ repository }}/compare/{{ previous.version }}...{{ version }})
{% elif version %}
[完整变更]({{ repository }}/commits/{{ version }})
{% endif %}\n
"""

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "^v[0-9].*"
sort_commits = "oldest"

# Match breaking changes first so internal commit types cannot hide them.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->破坏性变更" },
  { message = "^feat", group = "<!-- 1 -->新增" },
  { message = "^fix", group = "<!-- 2 -->修复" },
  { message = "^(perf|refactor|revert)", group = "<!-- 3 -->变更" },
  { message = "^docs", group = "<!-- 4 -->文档" },
  { message = ".*", skip = true },
]
